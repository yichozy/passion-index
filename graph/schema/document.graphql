# passion-index GraphQL schema — document domain.
#
# Conventions:
#   - Field names + argument names: snake_case (matches JSON output)
#   - Query / Mutation method names: PascalCase (matches Go receiver convention)
#   - All fields are non-nullable by default unless marked with trailing ?

enum DocStatus {
  PENDING
  OCR
  STRUCTURING
  SUMMARY
  DONE
  FAILED
}

type Document {
  id: UUID!
  filename: String!
  title: String
  description: String
  folder_id: UUID!
  folder: Folder
  status: DocStatus!
  page_count: Int
  error: String
  metadata: JSON
  created_at: Time!
  updated_at: Time!
  tree: TreeNode
}

type TreeNode {
  id: UUID!
  parent_id: UUID
  title: String!
  page_start: Int!
  page_end: Int!
  summary: String!
  text: String
  figures: [Figure!]!
  nodes: [TreeNode!]!
}

type Figure {
  name: String!
  page: Int!
  data: String
  caption: String
}

type DocumentList {
  items: [Document!]!
  total: Int!
}

type DocumentSearchResult {
  doc_id: UUID!
  filename: String!
  title: String
  description: String
  metadata: JSON
  score: Float!
}

type NodeSearchResult {
  id: UUID!
  doc_id: UUID!
  filename: String!
  title: String!
  summary: String!
  page_start: Int!
  page_end: Int!
  score: Float!
}

type Query {
  GetDocument(id: UUID!): Document
  GetDocumentListByFolder(folder_id: UUID!, recursive: Boolean = false, limit: Int = 20, offset: Int = 0): DocumentList!
  GetDocumentNode(node_id: UUID!): TreeNode
  GetDocumentNodesByPages(doc_id: UUID!, pages: [Int!]!): [TreeNode!]!
  SearchDocuments(query: String!, folder_id: UUID!, recursive: Boolean = false, metadata: JSON, limit: Int = 10): [DocumentSearchResult!]!
  SearchDocumentNodes(query: String!, folder_id: UUID!, recursive: Boolean = false, metadata: JSON, limit: Int = 20): [NodeSearchResult!]!
}

type Mutation {
  UploadDocument(file: Upload!, folder_id: UUID!, metadata: JSON): Document!
  DeleteDocument(doc_id: UUID!): Boolean!
  ReSummarizeDocument(doc_id: UUID!, force: Boolean = false): Boolean!
}
