# Default values for passion-index.
# Style follows lamp-service chart: image/service/server/secrets blocks.
# Sensitive values come from pre-created Kubernetes Secrets; this file only
# references them by name + key.

replicaCount: 1

image:
  repository: registry-vpc.ap-southeast-1.aliyuncs.com/knewta/passion-index
  tag: "v0.1.3"               # empty → use chart appVersion
  pullPolicy: IfNotPresent
  pullSecrets:
    - name: aliyun-acr-sg

service:
  type: ClusterIP
  port: 8900

# App-level config. Non-secret values are rendered directly as env vars; secret
# values are also rendered explicitly from the secret refs below.
server:
  # ENV=prod skips hopebox/env's .env loading; prod uses container-injected env.
  env: prod
  port: 8900            # container port; matches what main.go listens on
  # gorm SQL logging toggle (read by hopebox/dao).
  silentLog: "false"
  # LLM model selection for leaf-node summaries. Leave empty to use code defaults.
  leafModel: HUOSHANG-doubao-seed-evolving
  leafFallbackModel: deepseek-v4-flash

# Database connection — non-secret params set directly here. The Secret
# referenced below only carries credentials (username/password), produced
# by the bundled charts/paradedb chart or any compatible external Secret.
database:
  host: paradedb         # paradedb chart's Service name (release=paradedb → fullname=paradedb)
  port: 5432
  database: postgres     # must match paradedb's database.name (empty → postgres)

# Sensitive values + service connection info. Create these Secrets out-of-band.
# The chart maps each key explicitly into container env vars. Leave
# existingSecret empty to skip mounting that source.
secrets:
  # PostgreSQL — Secret carries credentials only. Connection target
  # (host/port/database) is configured in the `database` block above.
  database:
    existingSecret: "paradedb-pg"
    usernameKey: username
    passwordKey: password
  # Aliyun OSS — bucket/endpoint live with credentials so a storage migration
  # (switch bucket / region) is one Secret edit, not a ConfigMap+Secret dance.
  oss:
    existingSecret: "aliyun-oss"
    accessKeyKey: ALIYUN_OSS_ACCESS_KEY
    accessSecretKey: ALIYUN_OSS_ACCESS_SECRET
    bucketKey: ALIYUN_OSS_BUCKET
    endpointKey: ALIYUN_OSS_ENDPOINT
  # MinerU OCR + Popo — URLs + tokens together. The pipeline calls both services.
  mineru:
    existingSecret: "mineru-private"
    privateBaseUrlKey: MINERU_PRIVATE_BASE_URL
    popoBaseUrlKey: MINERU_POPO_BASE_URL
    privateTokenKey: MINERU_PRIVATE_TOKEN
    popoTokenKey: MINERU_POPO_TOKEN
  paddleOcr:
    existingSecret: "paddle-orc"
    apiKeyKey: PADDLE_OCR_KEY
  deepseek:
    existingSecret: "deepseek"
    apiKeyKey: DEEP_SEEK_API_KEY
  huoshang:
    existingSecret: "huoshang"
    apiKeyKey: HUO_SHANG_ARK_API_KEY


# Resource requests/limits. Pipeline is async goroutines; memory headroom
# matters when a large PDF's tree + figures are all in memory.
resources:
  limits:
    cpu: 4000m
    memory: 8Gi
  requests:
    cpu: 0
    memory: 0

# Both probes hit GET /healthz (cheap JSON response from main.go).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 20
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
