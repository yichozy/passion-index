apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: passion-index
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          env:
            - name: ENV
              value: {{ .Values.server.env | quote }}
            - name: PASSION_INDEX_PORT
              value: {{ .Values.server.port | quote }}
            - name: SILENT_LOG
              value: {{ .Values.server.silentLog | quote }}
            - name: PASSION_INDEX_LEAF_MODEL
              value: {{ .Values.server.leafModel | quote }}
            - name: PASSION_INDEX_LEAF_FALLBACK_MODEL
              value: {{ .Values.server.leafFallbackModel | quote }}
            {{- if .Values.secrets.database.existingSecret }}
            - name: POSTGRES_HOST
              value: {{ .Values.database.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.database.port | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.database.database | quote }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: {{ .Values.secrets.database.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret }}
                  key: {{ .Values.secrets.database.passwordKey }}
            {{- end }}
            {{- if .Values.secrets.oss.existingSecret }}
            - name: ALIYUN_OSS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oss.existingSecret }}
                  key: {{ .Values.secrets.oss.accessKeyKey }}
            - name: ALIYUN_OSS_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oss.existingSecret }}
                  key: {{ .Values.secrets.oss.accessSecretKey }}
            - name: ALIYUN_OSS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oss.existingSecret }}
                  key: {{ .Values.secrets.oss.bucketKey }}
            - name: ALIYUN_OSS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.oss.existingSecret }}
                  key: {{ .Values.secrets.oss.endpointKey }}
            {{- end }}
            {{- if .Values.secrets.mineru.existingSecret }}
            - name: MINERU_PRIVATE_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mineru.existingSecret }}
                  key: {{ .Values.secrets.mineru.privateBaseUrlKey }}
            - name: MINERU_POPO_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mineru.existingSecret }}
                  key: {{ .Values.secrets.mineru.popoBaseUrlKey }}
            - name: MINERU_PRIVATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mineru.existingSecret }}
                  key: {{ .Values.secrets.mineru.privateTokenKey }}
            - name: MINERU_POPO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.mineru.existingSecret }}
                  key: {{ .Values.secrets.mineru.popoTokenKey }}
            {{- end }}
            {{- if .Values.secrets.paddleOcr.existingSecret }}
            - name: PADDLE_OCR_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.paddleOcr.existingSecret }}
                  key: {{ .Values.secrets.paddleOcr.apiKeyKey }}
            {{- end }}
            {{- if .Values.secrets.deepseek.existingSecret }}
            - name: DEEP_SEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.deepseek.existingSecret }}
                  key: {{ .Values.secrets.deepseek.apiKeyKey }}
            {{- end }}
            {{- if .Values.secrets.huoshang.existingSecret }}
            - name: HUO_SHANG_ARK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.huoshang.existingSecret }}
                  key: {{ .Values.secrets.huoshang.apiKeyKey }}
            {{- end }}
            - name: MINERU_BACKEND
              value: "hybrid-engine"
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
