apiVersion: v1
kind: Service
metadata:
  name: {{ include "paradedb.fullname" . }}
  labels:
    {{- include "paradedb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "paradedb.selectorLabels" . | nindent 4 }}
