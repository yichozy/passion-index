{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paradedb.secretName" . }}
  labels:
    {{- include "paradedb.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Only credentials — host/port/database are non-secret and the consumer
  # chart should set them directly in its own values.
  username: {{ include "paradedb.user" . | quote }}
  password: {{ include "paradedb.password" . | quote }}
{{- end }}
