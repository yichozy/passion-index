# gqlgen config — modeled after curation-go/gqlgen.yml.
# Docs: https://gqlgen.com/getting-started/

# Schema files (split by domain).
schema:
  - graph/schema/*.graphql

# Generated executable schema.
exec:
  package: graph
  layout: single-file
  filename: graph/generated.go

# Generated GraphQL types (one Go type per schema `type`).
model:
  filename: graph/types/types_gen.go
  package: types

# Resolver location (one file per schema file).
resolver:
  layout: follow-schema
  dir: graph
  filename_template: "{name}.resolvers.go"
  omit_template_comment: false

# Autobind existing Go types instead of generating — empty for now, add
# in Phase 2.
autobind: []

# GraphQL scalar → Go type mapping.
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  Upload:
    model:
      - github.com/99designs/gqlgen/graphql.Upload
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID
  JSON:
    model:
      - github.com/99designs/gqlgen/graphql.Map
